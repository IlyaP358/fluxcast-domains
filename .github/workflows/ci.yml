name: CI

on:
    pull_request:

    push:
        branches: [main]
        paths:
            - "domains/**"
            - "tests/**"
            - "src/**"
            - "util/**"
            - "pyproject.toml"
            - ".github/workflows/ci.yml"

    workflow_dispatch:

concurrency:
    group: ${{ github.ref }}-ci
    cancel-in-progress: true

jobs:
    tests:
        name: Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install
              run: pip install -e ".[dev]"

            - name: Fetch PR information
              if: github.event_name == 'pull_request'
              run: |
                  echo "PR_AUTHOR=${{ github.event.pull_request.user.login }}" >> $GITHUB_ENV
                  echo "PR_AUTHOR_ID=${{ github.event.pull_request.user.id }}" >> $GITHUB_ENV

                  LABELS=$(gh api --jq '[.labels[].name] | join(",")' /repos/${{ github.repository }}/pulls/${{ github.event.number }})
                  echo "PR_LABELS=$LABELS" >> $GITHUB_ENV

                  FILES=$(gh api --paginate --jq '[.[] | select(.status != "removed") | .filename]' /repos/${{ github.repository }}/pulls/${{ github.event.number }}/files)
                  echo "CHANGED_FILES=$FILES" >> $GITHUB_ENV

                  REMOVED=$(gh api --paginate --jq '[.[] | select(.status == "removed") | {name: .filename, data: .patch}]' /repos/${{ github.repository }}/pulls/${{ github.event.number }}/files)
                  echo "DELETED_FILES=$REMOVED" >> $GITHUB_ENV

                  SINCE=$(date -u -d '14 days ago' +%Y-%m-%d)
                  RECENT=$(gh search prs --repo ${{ github.repository }} --author "${{ github.event.pull_request.user.login }}" --created ">=${SINCE}" --limit 100 --json number --jq 'length' 2>/dev/null || echo "0")
                  echo "PR_AUTHOR_RECENT_COUNT=$RECENT" >> $GITHUB_ENV
              env:
                  GH_TOKEN: ${{ github.token }}

            - name: Run tests
              run: pytest -q
